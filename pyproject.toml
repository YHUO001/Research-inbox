[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-inbox"
version = "0.1.0"
description = "Low-token academic paper discovery and triage pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
