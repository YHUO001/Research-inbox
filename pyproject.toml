[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-inbox"
version = "0.3.0"
description = "Low-token academic paper discovery and triage pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.34,<3",
  "google-auth-oauthlib>=1.2,<2",
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = [
  "scripts",
  "scripts.auth",
  "scripts.classify",
  "scripts.delivery",
  "scripts.enrich",
  "scripts.ingest",
  "scripts.maintenance",
  "scripts.pipeline",
  "scripts.summarize",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
