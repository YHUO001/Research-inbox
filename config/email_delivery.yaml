delivery_version: 2

provider: "gmail_api"
enabled_by_default: true

permissions:
  required_oauth_scopes:
    - "https://www.googleapis.com/auth/gmail.readonly"
    - "https://www.googleapis.com/auth/gmail.send"
  explicitly_not_requested:
    - "https://www.googleapis.com/auth/gmail.modify"
    - "https://mail.google.com/"

recipient_policy:
  source: "config_allowlist"
  recipients:
    - "a209072780@126.com"
  maximum_recipients_per_message: 1
  allow_cc: false
  allow_bcc: false

schedule:
  timezone: "Asia/Singapore"
  local_time: "after_unified_daily_pipeline"
  delivery_trigger: "end_of_unified_daily_pipeline"
  send_empty_digest: true

message_policy:
  delivery_mode: "daily_digest_only"
  maximum_messages_per_digest: 1
  require_nonempty_subject: true
  require_nonempty_text_body: true
  maximum_body_characters: 100000
  attachments_allowed: false
  subject_prefix: "[Research Inbox]"

idempotency:
  deterministic_message_id: true
  search_sent_mail_before_send: true
  state_path: "state/email_delivery_state.json"

logging:
  print_recipient: false
  print_subject: false
  print_body: false
  print_gmail_message_id: false
