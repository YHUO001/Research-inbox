# Research recognition rules.
# Deterministic first-pass classifier before optional semantic scoring.

version: 1

common:
  case_sensitive: false
  normalize_unicode: true
  inspect_fields:
    - title
    - snippet
    - venue
    - authors
    - abstract_if_available
    - metadata_line

  confidence_states:
    - confirmed
    - probable
    - uncertain
    - rejected

projects:
  zeroth-order-optimization:
    priority: high

    optical_zo:
      mandatory_summary: true
      match_any:
        - "zeroth[- ]order"
        - "zero[- ]order"
        - "derivative[- ]free"
        - "black[- ]box optimization"
        - "finite difference"
        - "function evaluation"
      require_context_any:
        - "optical neural network"
        - "photonic processor"
        - "photonic neural network"
        - "physical neural network"
        - "analog neural hardware"
        - "optical processor"
        - "silicon photonic"
        - "Mach[- ]Zehnder interferometer"
      action:
        route: "mandatory_summary"
        bypass_score: true

    llm_zo:
      match_any:
        - "large language model"
        - "LLM"
        - "foundation model"
        - "transformer"
        - "language model"
        - "fine[- ]tuning"
      require_method_any:
        - "zeroth[- ]order"
        - "ZO optimization"
        - "MeZO"
        - "PseuZO"
        - "BSZO"
        - "FEZO"
        - "gradient estimation"
        - "gradient-free"
      priority_features:
        query_efficiency:
          weight: 1.0
          patterns:
            - "fewer queries"
            - "query complexity"
            - "two-query"
            - "one-query"
            - "few-shot queries"
            - "function evaluations"
        low_rank_or_subspace:
          weight: 1.0
          patterns:
            - "low-rank"
            - "low dimensional subspace"
            - "subspace gradient"
            - "Bayesian subspace"
            - "projected gradient"
        query_reuse:
          weight: 1.0
          patterns:
            - "query reuse"
            - "historical queries"
            - "reuse function evaluations"
            - "baseline"
        structured_perturbation:
          weight: 0.85
          patterns:
            - "layer-wise"
            - "block-wise"
            - "structured perturbation"
            - "sparse perturbation"
        general_zo:
          weight: 0.4

  optical-neural-networks:
    priority: high
    match_any:
      - "optical neural network"
      - "diffractive neural network"
      - "photonic neural network"
      - "optical computing"
      - "physical neural network"
      - "analog machine learning"
      - "metasurface neural network"

    reject_if_only:
      - "using optical flow"
      - "optical image classification dataset"
      - "camera-based recognition"

cross_project_rules:
  # Do not classify papers as ZO merely because they mention optimization.
  require_method_evidence:
    zeroth-order:
      - "zeroth-order"
      - "zero-order"
      - "ZO"
      - "finite difference"
      - "black-box gradient"
      - "derivative-free"

  negative_patterns:
    - "zero-shot learning"
    - "zero-shot classification"
    - "zero order hold"

  ambiguous_method_names:
    FEZO:
      action: "manual_verification"
      reason: "abbreviation collision risk"

routing:
  confidence_policy:
    confirmed:
      action: "normal_pipeline"
    probable:
      action: "retain_and_score"
    uncertain:
      action: "review_queue"
    rejected:
      action: "archive"

  no_guess_policy:
    missing_method: "do_not_assign_project"
    missing_venue: "allow"
    missing_identifier: "allow"
