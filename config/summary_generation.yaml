summary_generation_version: 6
prompt_version: 2

execution:
  mode: "manual_provider_validation"
  provider: "deepseek"
  llm_enabled: false
  manual_provider_calls_allowed: true
  email_enabled: false
  update_summary_history: false
  use_full_text: true
  full_text_open_access_only: true

review:
  required: true
  approval_mode: "manual_all_or_nothing"
  confirmation_phrase: "REVIEWED"
  email_after_approval: false

provider:
  name: "deepseek"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"
  model: "deepseek-v4-pro"
  thinking_enabled: false
  max_output_tokens: 3600
  timeout_seconds: 90
  http_max_attempts: 3
  validation_attempts: 2
  response_format: "json_object"
  pricing:
    currency: "CNY"
    input_cache_hit_cny_per_million: 0.025
    input_cache_miss_cny_per_million: 3.0
    output_cny_per_million: 6.0

output:
  language: "zh-CN"
  require_chinese_narrative: true
  minimum_han_characters: 120
  method_implementation_min_paragraphs: 2
  method_implementation_max_paragraphs: 6

full_text:
  enabled: true
  open_access_only: true
  source_strategy: "springer_openaccess_jats_then_non_springer_open_url"
  springer_api_key_env: "SPRINGER_NATURE_API_KEY"
  springer_openaccess_endpoint: "https://api.springernature.com/openaccess/jats"
  allow_direct_nature_urls: false
  allow_non_springer_open_urls: true
  persist_extracted_text: false
  qualitative_methods_only: true
  numeric_grounding_scope: "title_and_abstract_only"
  maximum_download_bytes: 15000000
  maximum_method_characters: 12000
  timeout_seconds: 10
  candidate_timeout_seconds: 30
  candidate_url_limit: 2
  preferred_sections:
    - "methods"
    - "materials and methods"
    - "experimental setup"
    - "implementation"
    - "system architecture"
    - "network architecture"
    - "training"
    - "fabrication"
    - "device design"

benchmark:
  mode: "manual_flash_vs_pro"
  same_prompt_for_all_models: true
  thinking_enabled: false
  models:
    - label: "flash"
      model: "deepseek-v4-flash"
      pricing:
        currency: "CNY"
        input_cache_hit_cny_per_million: 0.02
        input_cache_miss_cny_per_million: 1.0
        output_cny_per_million: 2.0
    - label: "pro"
      model: "deepseek-v4-pro"
      pricing:
        currency: "CNY"
        input_cache_hit_cny_per_million: 0.025
        input_cache_miss_cny_per_million: 3.0
        output_cny_per_million: 6.0

limits:
  maximum_summaries_per_run: 3
  maximum_abstract_characters: 2500
  maximum_prompt_characters: 40000

grounding:
  information_basis: "title_metadata_abstract_and_optional_open_full_text_methods"
  require_reported_by_authors_marker: true
  reject_unsupported_numeric_claims: true
  numeric_matching_mode: "loose_full_evidence"
  numeric_relative_tolerance: 0.02
  numeric_absolute_tolerance: 0.02
  unavailable_value: "not_available"
  enforce_onn_architecture_evidence: true

outputs:
  request_directory: "data/summary_requests"
  summary_directory: "data/summaries"
  digest_directory: "data/digests"
  review_directory: "data/reviews"
  manifest_path: "state/summary_generation_manifest.json"
  review_manifest_path: "state/summary_review_manifest.json"
  benchmark_directory: "data/benchmarks/deepseek"
  benchmark_manifest_path: "state/deepseek_benchmark_manifest.json"
