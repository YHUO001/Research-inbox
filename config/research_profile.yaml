# Research profile for paper discovery and relevance scoring.
# Keep this file free of API keys and other secrets.

profile_version: 1

default_language: en

projects:
  - id: optical-neural-networks
    name: "Optical neural networks"
    enabled: true

    # This statement is used for semantic retrieval. Keep it broad enough to
    # capture vocabulary drift, while preserving the project's main emphasis.
    research_statement: >
      This project studies optical neural networks and photonic machine-learning
      systems, with primary emphasis on free-space and spatial optical computing.
      The main research interest is how optical neural networks can be trained,
      calibrated, and scaled in physical hardware, including in-situ and
      hardware-aware learning, optical or approximate backpropagation,
      backpropagation-free and forward-only training, model-free optimization,
      transfer learning on analog hardware, and methods that remain robust to
      misalignment, noise, nonlinearity, fabrication variation, and other
      physical imperfections. The project also tracks architectural innovation
      in diffractive neural networks, coherent optical processors, metasurface
      and holographic systems, optical convolution and encoding, neuromorphic
      photonics, spiking optoelectronic networks, and hybrid optical-electronic
      systems. Although spatial optical implementations are the principal focus,
      integrated and on-chip photonic neural networks remain within scope,
      especially when they introduce transferable training methods, scalable
      end-to-end architectures, nonlinear processing, or meaningful gains in
      energy efficiency, latency, throughput, or physical deployability. Work on
      new applications is relevant when it demonstrates a substantive optical
      computing capability rather than merely applying a conventional model to
      a new dataset.

    core_topics:
      - "free-space optical neural networks"
      - "spatial optical neural networks"
      - "training physical and optical neural networks"
      - "in-situ optical training and calibration"
      - "diffractive optical neural networks"
      - "optical neural network architectures"
      - "applications of optical neural networks"

    methods:
      - "optical and physical backpropagation"
      - "backpropagation-free and forward-only learning"
      - "hardware-aware and model-free optimization"
      - "transfer learning on analog photonic hardware"
      - "robust training under misalignment, noise, and device variation"
      - "diffractive, coherent, holographic, and metasurface optical computing"
      - "optical convolution, encoding, and nonlinear processing"
      - "photonic-electronic hardware-software co-design"

    adjacent_topics:
      - "integrated and on-chip photonic neural networks"
      - "neuromorphic photonics and optoelectronic spiking networks"
      - "physical neural networks and analog machine learning hardware"
      - "silicon photonic accelerators"
      - "optical computing for sensing, imaging, and signal processing"
      - "photonic machine learning systems"

