  - id: zeroth-order-optimization
    name: "Zeroth-order optimization"
    enabled: true

    research_statement: >
      This project studies zeroth-order optimization methods for training and
      fine-tuning neural networks when gradients are unavailable, unreliable, or
      too memory-intensive to compute. It has two principal application tracks.
      The first is zeroth-order and black-box training of optical neural networks,
      photonic processors, physical neural networks, and other analog hardware.
      Because such work is rare and directly relevant to experimental systems,
      any alert-returned paper that applies a genuine zeroth-order method to an
      optical or physical neural network should be accepted for full summary,
      independent of venue prestige and without applying the normal relevance
      threshold. The second track is memory-efficient zeroth-order fine-tuning of
      large language models and foundation models. Within this track, the highest
      priority is given to methods that reduce the number of function queries,
      reuse previous queries, improve perturbation or sampling efficiency, exploit
      low-rank gradients or low-dimensional subspaces, use structured or
      layer-wise perturbations, reduce estimator variance, or retain
      inference-level memory. General advances in zeroth-order theory,
      convergence, estimators, adaptive smoothing, sparsity, quantization,
      Bayesian estimation, and black-box optimization remain relevant when they
      can plausibly improve neural-network training or expensive physical
      experiments.

    core_topics:
      - "zeroth-order optimization"
      - "derivative-free optimization for neural networks"
      - "black-box neural network training"
      - "zeroth-order fine-tuning of large language models"
      - "zeroth-order training of optical neural networks"
      - "query-efficient zeroth-order optimization"
      - "low-rank and subspace zeroth-order optimization"

    methods:
      - "randomized finite-difference gradient estimation"
      - "two-point and one-point zeroth-order estimators"
      - "low-query and two-query gradient estimation"
      - "query reuse and historical function-evaluation reuse"
      - "low-rank perturbations and low-dimensional search subspaces"
      - "layer-wise, block-wise, sparse, and structured parameter perturbations"
      - "learned perturbation distributions and sampling policies"
      - "variance reduction, baselines, and Bayesian gradient estimation"
      - "in-place and inference-memory zeroth-order fine-tuning"
      - "hardware-aware black-box optimization"

    adjacent_topics:
      - "evolution strategies and natural evolution strategies"
      - "simultaneous perturbation stochastic approximation"
      - "policy-gradient interpretations of zeroth-order optimization"
      - "gradient-free reinforcement learning"
      - "parameter-efficient and sparse LLM fine-tuning"
      - "non-differentiable objective optimization"
      - "physical neural networks and analog computing hardware"

    excluded_topics:
      - "zero-order hold in control systems"
      - "zeroth law of thermodynamics"
      - "generic derivative-free engineering optimization without a neural-network or expensive black-box connection"

    routing_rules:
      mandatory_full_summary:
        source_scope:
          - "google_scholar_email"
        any_of_topics:
          - "zeroth-order optimization for optical neural networks"
          - "zeroth-order optimization for photonic processors"
          - "black-box training of physical neural networks"
          - "gradient-free training of optical or analog neural hardware"
        bypass_relevance_threshold: true
        bypass_venue_threshold: true
        overflow_action: "queue_next_run"
        rationale: >
          Optical and physical-hardware ZO papers are rare and directly relevant,
          so every alert-returned match must be summarized.

      llm_priority_signals:
        - signal: "explicit reduction in query complexity"
          weight: 1.0
        - signal: "two-query, one-query, or few-query estimator"
          weight: 1.0
        - signal: "query reuse, replay, historical baseline, or sample reuse"
          weight: 1.0
        - signal: "low-rank gradient or perturbation structure"
          weight: 1.0
        - signal: "low-dimensional, random, learned, or Bayesian subspace"
          weight: 1.0
        - signal: "structured, sparse, block-wise, or layer-wise perturbation"
          weight: 0.85
        - signal: "inference-level memory or forward-only implementation"
          weight: 0.75
        - signal: "general ZO theory or benchmark without query or structure gains"
          weight: 0.4

