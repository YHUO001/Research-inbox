pipeline_version: 12

timezone: Asia/Singapore

sources:
  google_scholar_email:
    enabled: true
    collection_frequency: daily
    primary_daily_inbox_source: true

  openalex:
    enabled: true
    collection_frequency_days: 2
    role: "semantic_discovery_and_metadata"
    discovery_enabled: true
    config_path: "config/openalex_discovery.yaml"
    schema_path: "schemas/openalex_candidate.schema.json"

  semantic_scholar:
    enabled: false
    collection_frequency_days: 7
    role: "recommendation_and_citation_graph"

  crossref:
    enabled: true
    role: "metadata_enrichment"

parsing:
  google_scholar_email:
    config_path: "config/google_scholar_alerts.yaml"
    schema_path: "schemas/alert_candidate.schema.json"
    parser_version: 3
    deterministic_only: true

recognition:
  enabled: true
  deterministic_first: true
  config_path: "config/recognition_rules.yaml"
  rules_version: 4
  venue_config_path: "config/venues.yaml"
  result_schema_path: "schemas/recognition_result.schema.json"
  classifier_version: 2
  llm_fallback_enabled: false
  outputs:
    recognition_results: "data/recognition_results.jsonl"
    routing_manifest: "state/routing_manifest.json"
    queue_directory: "data/queues"

discovery:
  openalex:
    enabled: true
    execution_mode: "scheduled_with_state_gate"
    minimum_interval_hours: 44
    config_path: "config/openalex_discovery.yaml"
    source_registry: "data/paper_registry.jsonl"
    state_path: "state/openalex_discovery_state.json"
    manifest_path: "state/openalex_discovery_manifest.json"
    filter_audit_path: "state/openalex_filter_audit.json"
    deterministic_project_filter: true
    cross_source_deduplication:
      - "openalex_work_id"
      - "doi"
      - "normalized_title_year"
      - "content_fingerprint"
    use_venue_list_for_queries: false
    persist_raw_provider_responses: false
    download_full_text: false

enrichment:
  enabled: true
  execution_mode: "daily_post_collection_post_discovery_and_manual"
  config_path: "config/metadata_enrichment.yaml"
  schema_path: "schemas/enriched_paper.schema.json"
  source_registry: "data/paper_registry.jsonl"
  enriched_registry: "data/enriched_paper_registry.jsonl"
  cache_path: "state/enrichment_cache.json"
  manifest_path: "state/enrichment_manifest.json"
  preserve_source_registry: true
  persist_raw_provider_responses: false
  download_full_text: false
  openalex_api_key_required: true
  active_discovery_enabled: true

routing:
  order:
    - validate_parse
    - normalize_and_deduplicate
    - apply_parser_quality_gate
    - apply_source_scoped_mandatory_rules
    - apply_tier_1_alert_venue_rule
    - apply_optical_zo_override
    - assign_projects
    - route_missing_metadata
    - rebuild_queues

  venue_policy:
    config_path: "config/venues.yaml"
    mode: "post_retrieval_only"
    applies_to_sources:
      - "google_scholar_email"
    use_venue_list_for_discovery_queries: false

  project_rule_overrides:
    config_path: "config/recognition_rules.yaml"
    rules:
      - id: "optical-zo-must-summarize"
        project_id: "zeroth-order-optimization"
        source_scope:
          - "google_scholar_email"
        action: "enqueue_mandatory_summary"
        bypass_relevance_threshold: true
        bypass_venue_threshold: true
        overflow_action: "carry_forward"
        explanation: >
          Any Scholar-alert paper applying zeroth-order or black-box optimization
          to optical neural networks, photonic processors, physical neural
          networks, or analog neural hardware must receive a full summary.

  mandatory_summary_queue:
    enabled: true
    priority: "highest"
    process_before_standard_candidates: true
    accepted_reasons:
      - "tier_1_alert_venue"
      - "optical_zo_project_override"
    bypass_relevance_threshold: true
    respect_daily_token_hard_stop: true
    overflow_action: "carry_forward"

scoring:
  enabled: true
  execution_mode: "automatic_after_registry_enrichment_or_routing_change"
  deterministic_only: true
  config_path: "config/scoring.yaml"
  result_schema_path: "schemas/scoring_result.schema.json"
  llm_candidate_schema_path: "schemas/llm_candidate.schema.json"
  source_registry: "data/paper_registry.jsonl"
  enriched_registry: "data/enriched_paper_registry.jsonl"
  recognition_results: "data/recognition_results.jsonl"
  summary_history: "state/summary_history.json"
  scoring_results: "data/scoring_results.jsonl"
  llm_candidate_queue: "data/queues/llm_candidate_queue.jsonl"
  selection_manifest: "state/selection_manifest.json"
  mandatory_candidates_sort_first: true
  completed_summary_ids_are_excluded: true
  integrated_workflows:
    - "Daily Research Inbox"
    - "OpenAlex Research Discovery"
    - "Repair Scholar Registry"
    - "Rebuild Research Routes"
    - "Enrich Paper Registry"

summary_generation:
  enabled: false
  execution_mode: "manual_provider_validation"
  provider: "deepseek"
  model: "deepseek-v4-pro"
  thinking_enabled: false
  output_language: "zh-CN"
  config_path: "config/summary_generation.yaml"
  request_schema_path: "schemas/summary_request.schema.json"
  summary_schema_path: "schemas/paper_summary.schema.json"
  source_queue: "data/queues/llm_candidate_queue.jsonl"
  request_directory: "data/summary_requests"
  summary_directory: "data/summaries"
  digest_directory: "data/digests"
  review_directory: "data/reviews"
  manifest_path: "state/summary_generation_manifest.json"
  maximum_summaries_per_run: 3
  information_basis: "title_metadata_abstract_and_optional_open_full_text_methods"
  use_full_text: true
  full_text_open_access_only: true
  full_text_persisted: false
  full_text_scope: "qualitative_method_explanation_only"
  numeric_grounding_scope: "title_and_abstract_only"
  require_detailed_method_principle: true
  minimum_method_implementation_paragraphs: 2
  update_summary_history: false
  human_review_required: true
  email_enabled: false
  scheduled_generation_enabled: false
  integrated_workflows:
    - "Build Summary Dry Run"
    - "Generate DeepSeek Summaries"
    - "Prepare Human Summary Review"
    - "Finalize Reviewed Summaries"

limits:
  max_raw_items_per_source: 100
  max_normalized_candidates: 100
  max_candidates_after_scoring: 10
  max_candidates_to_llm: 5
  max_daily_summaries: 3
  max_abstract_characters_per_paper: 2500
  max_method_context_characters_per_paper: 12000
  max_output_characters: 8000

thresholds:
  archive_below: 0.55
  retain_without_summary_from: 0.55
  summarize_from: 0.72
  urgent_from: 0.85

llm:
  enabled: false
  allow_open_full_text_method_context: true
  persist_full_text: false
  skip_when_no_high_score_candidates: true

delivery:
  email:
    enabled: false
    require_recipient_allowlist: true
    max_messages_per_run: 1

storage:
  retain_raw_days: 30
  retain_all_normalized_records: true
  raw_email_mime_persisted: false
  full_text_persisted: false
