pipeline_version: 4

timezone: Asia/Singapore

sources:
  google_scholar_email:
    enabled: true
    collection_frequency: daily
    primary_daily_inbox_source: true

  openalex:
    enabled: true
    collection_frequency_days: 2
    role: "semantic_discovery_and_metadata"

  semantic_scholar:
    enabled: false
    collection_frequency_days: 7
    role: "recommendation_and_citation_graph"

  crossref:
    enabled: true
    role: "metadata_enrichment"

parsing:
  google_scholar_email:
    config_path: "config/google_scholar_alerts.yaml"
    schema_path: "schemas/alert_candidate.schema.json"
    parser_version: 3
    deterministic_only: true

recognition:
  enabled: true
  deterministic_first: true
  config_path: "config/recognition_rules.yaml"
  venue_config_path: "config/venues.yaml"
  result_schema_path: "schemas/recognition_result.schema.json"
  classifier_version: 2
  llm_fallback_enabled: false
  outputs:
    recognition_results: "data/recognition_results.jsonl"
    routing_manifest: "state/routing_manifest.json"
    queue_directory: "data/queues"

routing:
  order:
    - validate_parse
    - normalize_and_deduplicate
    - apply_parser_quality_gate
    - apply_tier_1_alert_venue_rule
    - apply_optical_zo_override
    - assign_projects
    - route_missing_metadata
    - rebuild_queues

  venue_policy:
    config_path: "config/venues.yaml"
    mode: "post_retrieval_only"
    applies_to_sources:
      - "google_scholar_email"
    use_venue_list_for_discovery_queries: false

  project_rule_overrides:
    config_path: "config/recognition_rules.yaml"
    rules:
      - id: "optical-zo-must-summarize"
        project_id: "zeroth-order-optimization"
        source_scope:
          - "google_scholar_email"
        action: "enqueue_mandatory_summary"
        bypass_relevance_threshold: true
        bypass_venue_threshold: true
        overflow_action: "carry_forward"
        explanation: >
          Any Scholar-alert paper applying zeroth-order or black-box optimization
          to optical neural networks, photonic processors, physical neural
          networks, or analog neural hardware must receive a full summary.

  mandatory_summary_queue:
    enabled: true
    priority: "highest"
    process_before_standard_candidates: true
    accepted_reasons:
      - "tier_1_alert_venue"
      - "optical_zo_project_override"
    bypass_relevance_threshold: true
    respect_daily_token_hard_stop: true
    overflow_action: "carry_forward"

limits:
  max_raw_items_per_source: 100
  max_normalized_candidates: 100
  max_candidates_after_scoring: 10
  max_candidates_to_llm: 5
  max_daily_summaries: 3
  max_abstract_characters_per_paper: 2500
  max_output_characters: 1200

thresholds:
  archive_below: 0.55
  retain_without_summary_from: 0.55
  summarize_from: 0.72
  urgent_from: 0.85

llm:
  enabled: false
  allow_full_text: false
  skip_when_no_high_score_candidates: true

delivery:
  email:
    enabled: false
    require_recipient_allowlist: true
    max_messages_per_run: 1

storage:
  retain_raw_days: 30
  retain_all_normalized_records: true
  raw_email_mime_persisted: false
