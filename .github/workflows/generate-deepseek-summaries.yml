name: Generate DeepSeek Summaries

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  generate-summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Refresh provider-neutral summary requests
        run: |
          python -m scripts.summarize.prepare_digest \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --selection-manifest-path runtime-state/state/selection_manifest.json \
            --config config/summary_generation.yaml \
            --request-schema schemas/summary_request.schema.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json

      - name: Generate and locally validate DeepSeek summaries
        id: generate
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m scripts.summarize.generate_summaries \
            --dry-run-manifest-path runtime-state/state/summary_generation_manifest.json \
            --summary-schema schemas/paper_summary.schema.json \
            --config config/summary_generation.yaml \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json
          generate_exit_code=$?
          echo "exit_code=${generate_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Persist summary validation artifacts
        if: always()
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          git add \
            data/summary_requests \
            data/summaries \
            data/digests \
            state/summary_generation_manifest.json
          if git diff --cached --quiet; then
            echo "No DeepSeek summary changes to persist."
            exit 0
          fi
          git commit -m "Generate validated DeepSeek summary preview [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state

      - name: Fail after persisting validation diagnostics
        if: steps.generate.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.generate.outputs.exit_code }}"
