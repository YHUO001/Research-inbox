name: Generate DeepSeek Summaries

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  generate-summaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Refresh provider-neutral summary requests
        run: |
          python -m scripts.summarize.prepare_digest \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --selection-manifest-path runtime-state/state/selection_manifest.json \
            --config config/summary_generation.yaml \
            --request-schema schemas/summary_request.schema.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json

      - name: Prepare open full-text method context
        env:
          PREPARED_ROOT: ${{ runner.temp }}/research-inbox-generation
        run: |
          rm -rf "${PREPARED_ROOT}"
          mkdir -p "${PREPARED_ROOT}"
          python -m scripts.summarize.staged_summary_pipeline prepare \
            --dry-run-manifest-path runtime-state/state/summary_generation_manifest.json \
            --config config/summary_generation.yaml \
            --prepared-root "${PREPARED_ROOT}"
          cat "${PREPARED_ROOT}/fulltext_preparation.json"

      - name: Generate and locally validate DeepSeek summaries
        id: generate
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PREPARED_ROOT: ${{ runner.temp }}/research-inbox-generation
        run: |
          set +e
          python -m scripts.summarize.staged_summary_pipeline generate \
            --dry-run-manifest-path runtime-state/state/summary_generation_manifest.json \
            --summary-schema schemas/paper_summary.schema.json \
            --config config/summary_generation.yaml \
            --prepared-root "${PREPARED_ROOT}" \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json
          generate_exit_code=$?
          if [ -f runtime-state/state/summary_generation_manifest.json ]; then
            cat runtime-state/state/summary_generation_manifest.json
          fi
          echo "exit_code=${generate_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build human review packet
        if: steps.generate.outputs.exit_code == '0'
        run: |
          python -m scripts.summarize.build_review_packet \
            --generation-manifest-path runtime-state/state/summary_generation_manifest.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --review-manifest-path runtime-state/state/summary_review_manifest.json
          cat runtime-state/state/summary_review_manifest.json

      - name: Persist summary validation and review artifacts
        if: always()
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"

          mkdir -p data/summary_requests data/summaries data/digests data/reviews
          git add -A -- \
            data/summary_requests \
            data/summaries \
            data/digests \
            data/reviews \
            state/summary_generation_manifest.json
          if [ -f state/summary_review_manifest.json ]; then
            git add state/summary_review_manifest.json
          fi
          if git diff --cached --quiet; then
            echo "No DeepSeek summary or review changes to persist."
            exit 0
          fi
          git commit -m "Generate validated summary review packet [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state

      - name: Fail after persisting validation diagnostics
        if: steps.generate.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.generate.outputs.exit_code }}"
