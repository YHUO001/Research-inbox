name: Daily Research Inbox

on:
  schedule:
    # Singapore time: 08:17 and 20:47. Avoid the top of the hour.
    - cron: "17 0 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  ingest-scholar-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Collect new Scholar alerts
        id: collect
        shell: bash
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set +e
          python -m scripts.ingest.gmail_collector \
            --config config/google_scholar_alerts.yaml \
            --state-dir runtime-state/state \
            --output-dir runtime-state/data
          collector_exit_code=$?
          echo "exit_code=${collector_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Rebuild deterministic routes
        id: route
        if: steps.collect.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -m scripts.pipeline.route_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --recognition-path runtime-state/data/recognition_results.jsonl \
            --queue-dir runtime-state/data/queues \
            --manifest-path runtime-state/state/routing_manifest.json
          route_exit_code=$?
          echo "exit_code=${route_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Refresh normalized metadata
        id: enrich
        if: >-
          steps.collect.outputs.exit_code == '0' &&
          steps.route.outputs.exit_code == '0'
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RESEARCH_INBOX_CONTACT_EMAIL: ${{ vars.RESEARCH_INBOX_CONTACT_EMAIL }}
        run: |
          set +e
          python -m scripts.enrich.enrich_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --output-path runtime-state/data/enriched_paper_registry.jsonl \
            --manifest-path runtime-state/state/enrichment_manifest.json \
            --cache-path runtime-state/state/enrichment_cache.json \
            --config config/metadata_enrichment.yaml \
            --schema schemas/enriched_paper.schema.json
          enrich_exit_code=$?
          echo "exit_code=${enrich_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build deterministic scores and budgeted queue
        id: score
        if: >-
          steps.collect.outputs.exit_code == '0' &&
          steps.route.outputs.exit_code == '0' &&
          steps.enrich.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -m scripts.pipeline.score_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --enriched-path runtime-state/data/enriched_paper_registry.jsonl \
            --recognition-path runtime-state/data/recognition_results.jsonl \
            --history-path runtime-state/state/summary_history.json \
            --scoring-path runtime-state/data/scoring_results.jsonl \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --manifest-path runtime-state/state/selection_manifest.json \
            --config config/scoring.yaml \
            --scoring-schema schemas/scoring_result.schema.json \
            --queue-schema schemas/llm_candidate.schema.json
          score_exit_code=$?
          echo "exit_code=${score_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Persist sanitized state
        if: always()
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          git add state data

          if git diff --cached --quiet; then
            echo "No state changes to persist."
            exit 0
          fi

          git commit -m "Update research inbox state [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state

      - name: Fail after persisting collector retry state
        if: steps.collect.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.collect.outputs.exit_code }}"

      - name: Fail after persisting routing diagnostics
        if: >-
          steps.collect.outputs.exit_code == '0' &&
          steps.route.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.route.outputs.exit_code }}"

      - name: Fail after persisting enrichment diagnostics
        if: >-
          steps.collect.outputs.exit_code == '0' &&
          steps.route.outputs.exit_code == '0' &&
          steps.enrich.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.enrich.outputs.exit_code }}"

      - name: Fail after persisting scoring diagnostics
        if: >-
          steps.collect.outputs.exit_code == '0' &&
          steps.route.outputs.exit_code == '0' &&
          steps.enrich.outputs.exit_code == '0' &&
          steps.score.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.score.outputs.exit_code }}"
