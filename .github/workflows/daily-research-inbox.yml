name: Unified Daily Research Inbox

on:
  schedule:
    # Singapore time: primary run at 08:17; 20:47 retries only missing sources.
    - cron: "17 0 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  unified-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Plan primary or retry source collection
        id: source_plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python -m scripts.pipeline.daily_source_gate plan \
            --gmail-state-path runtime-state/state/gmail_ingestion_state.json \
            --openalex-state-path runtime-state/state/openalex_discovery_state.json \
            --event-name "${EVENT_NAME}" \
            --event-schedule "${EVENT_SCHEDULE}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Collect Google Scholar alerts
        id: scholar
        if: steps.source_plan.outputs.run_scholar == 'true'
        shell: bash
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set +e
          python -m scripts.ingest.gmail_collector \
            --config config/google_scholar_alerts.yaml \
            --state-dir runtime-state/state \
            --output-dir runtime-state/data
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Discover OpenAlex papers
        id: openalex
        if: steps.source_plan.outputs.run_openalex == 'true'
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          python -m scripts.discovery.openalex_discovery \
            --config config/openalex_discovery.yaml \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --state-path runtime-state/state/openalex_discovery_state.json \
            --manifest-path runtime-state/state/openalex_discovery_manifest.json \
            --schema schemas/openalex_candidate.schema.json \
            --recognition config/recognition_rules.yaml \
            --venues config/venues.yaml \
            --force
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Verify both discovery sources completed today
        id: readiness
        if: steps.source_plan.outputs.should_run == 'true'
        run: |
          python -m scripts.pipeline.daily_source_gate verify \
            --gmail-state-path runtime-state/state/gmail_ingestion_state.json \
            --openalex-state-path runtime-state/state/openalex_discovery_state.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Reconcile Scholar and OpenAlex into one registry
        if: steps.readiness.outputs.ready == 'true'
        run: |
          python -m scripts.pipeline.reconcile_registry \
            --raw-registry-path runtime-state/data/paper_registry.jsonl \
            --unified-registry-path runtime-state/data/unified_paper_registry.jsonl \
            --alias-path runtime-state/state/unified_candidate_aliases.json \
            --manifest-path runtime-state/state/unified_registry_manifest.json \
            --history-path runtime-state/state/summary_history.json

      - name: Refresh normalized metadata for unified registry
        if: steps.readiness.outputs.ready == 'true'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RESEARCH_INBOX_CONTACT_EMAIL: ${{ vars.RESEARCH_INBOX_CONTACT_EMAIL }}
        run: |
          python -m scripts.enrich.enrich_registry \
            --registry-path runtime-state/data/unified_paper_registry.jsonl \
            --output-path runtime-state/data/enriched_paper_registry.jsonl \
            --manifest-path runtime-state/state/enrichment_manifest.json \
            --cache-path runtime-state/state/enrichment_cache.json \
            --config config/metadata_enrichment.yaml \
            --schema schemas/enriched_paper.schema.json

      - name: Rebuild deterministic routes from unified registry
        if: steps.readiness.outputs.ready == 'true'
        run: |
          python -m scripts.pipeline.route_registry \
            --registry-path runtime-state/data/unified_paper_registry.jsonl \
            --recognition-path runtime-state/data/recognition_results.jsonl \
            --queue-dir runtime-state/data/queues \
            --manifest-path runtime-state/state/routing_manifest.json

      - name: Build deterministic scores and budgeted queue
        if: steps.readiness.outputs.ready == 'true'
        run: |
          python -m scripts.pipeline.score_registry \
            --registry-path runtime-state/data/unified_paper_registry.jsonl \
            --enriched-path runtime-state/data/enriched_paper_registry.jsonl \
            --recognition-path runtime-state/data/recognition_results.jsonl \
            --history-path runtime-state/state/summary_history.json \
            --scoring-path runtime-state/data/scoring_results.jsonl \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --manifest-path runtime-state/state/selection_manifest.json \
            --config config/scoring.yaml \
            --scoring-schema schemas/scoring_result.schema.json \
            --queue-schema schemas/llm_candidate.schema.json

      - name: Prepare automatic summary requests
        id: prepare
        if: steps.readiness.outputs.ready == 'true'
        env:
          FILTERED_QUEUE: ${{ runner.temp }}/automatic-summary-queue.jsonl
        run: |
          python -m scripts.summarize.prepare_automatic_digest \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --history-path runtime-state/state/summary_history.json \
            --selection-manifest-path runtime-state/state/selection_manifest.json \
            --config config/summary_generation.yaml \
            --request-schema schemas/summary_request.schema.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json \
            --filtered-queue-path "${FILTERED_QUEUE}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("runtime-state/state/summary_generation_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"request_count={int(manifest.get('request_count') or 0)}\n")
              handle.write(f"status={manifest.get('status') or 'unknown'}\n")
          PY

      - name: Prepare open full-text method context
        id: fulltext
        if: steps.prepare.outputs.request_count != '0'
        env:
          SPRINGER_NATURE_API_KEY: ${{ secrets.SPRINGER_NATURE_API_KEY }}
          PREPARED_ROOT: ${{ runner.temp }}/research-inbox-generation
        run: |
          rm -rf "${PREPARED_ROOT}"
          mkdir -p "${PREPARED_ROOT}"
          python -m scripts.summarize.prepare_fulltext_bounded \
            --dry-run-manifest-path runtime-state/state/summary_generation_manifest.json \
            --config config/summary_generation.yaml \
            --prepared-root "${PREPARED_ROOT}"
          cat "${PREPARED_ROOT}/fulltext_preparation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          audit = json.loads(
              (Path(os.environ["PREPARED_ROOT"]) / "fulltext_preparation.json").read_text(
                  encoding="utf-8"
              )
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(
                  f"prepared_request_count={int(audit.get('prepared_request_count') or 0)}\n"
              )
              handle.write(
                  f"skipped_no_abstract_count={int(audit.get('skipped_no_abstract_count') or 0)}\n"
              )
              handle.write(
                  f"abstract_fallback_count={int(audit.get('abstract_fallback_count') or 0)}\n"
              )
          PY

      - name: Generate and locally validate DeepSeek summaries
        id: generate
        if: steps.fulltext.outputs.prepared_request_count != '0'
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PREPARED_ROOT: ${{ runner.temp }}/research-inbox-generation
        run: |
          set +e
          python -m scripts.summarize.generate_automatic_summaries \
            --dry-run-manifest-path runtime-state/state/summary_generation_manifest.json \
            --summary-schema schemas/paper_summary.schema.json \
            --config config/summary_generation.yaml \
            --prepared-root "${PREPARED_ROOT}" \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          if [ -f runtime-state/state/summary_generation_manifest.json ]; then
            cat runtime-state/state/summary_generation_manifest.json
          fi
          exit 0

      - name: Add DOI links and finalize automatically
        if: >-
          steps.fulltext.outputs.prepared_request_count != '0' &&
          steps.generate.outputs.exit_code == '0'
        run: |
          python -m scripts.summarize.add_digest_doi_links \
            --generation-manifest-path runtime-state/state/summary_generation_manifest.json \
            --output-root runtime-state/data
          python -m scripts.summarize.finalize_automatic_safe \
            --generation-manifest-path runtime-state/state/summary_generation_manifest.json \
            --history-path runtime-state/state/summary_history.json \
            --summary-schema schemas/paper_summary.schema.json \
            --config config/summary_generation.yaml

      - name: Update long-term knowledge index
        if: >-
          steps.fulltext.outputs.prepared_request_count != '0' &&
          steps.generate.outputs.exit_code == '0'
        run: |
          python -m scripts.knowledge.build_index \
            --generation-manifest-path runtime-state/state/summary_generation_manifest.json \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/knowledge_base_manifest.json

      - name: Send one daily Chinese digest
        id: send
        if: >-
          steps.readiness.outputs.ready == 'true' &&
          (
            steps.prepare.outputs.request_count == '0' ||
            steps.fulltext.outputs.prepared_request_count == '0' ||
            steps.generate.outputs.exit_code == '0'
          )
        shell: bash
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set +e
          python -m scripts.delivery.send_daily_digest_safe \
            --config config/email_delivery.yaml \
            --state-root runtime-state
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Persist unified daily state
        if: always()
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          mkdir -p data/queues data/summary_requests data/summaries data/digests data/knowledge_base state
          git add -A -- data state
          if git diff --cached --quiet; then
            echo "No unified daily state changes to persist."
            exit 0
          fi
          git commit -m "Run unified daily research inbox [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state

      - name: Fail when one discovery source is still unavailable
        if: >-
          steps.source_plan.outputs.should_run == 'true' &&
          steps.readiness.outputs.ready != 'true'
        run: |
          echo "Missing sources: ${{ steps.readiness.outputs.missing_sources }}"
          exit 1

      - name: Fail after persisting summary validation diagnostics
        if: >-
          steps.fulltext.outputs.prepared_request_count != '0' &&
          steps.generate.outputs.exit_code != '0'
        run: exit "${{ steps.generate.outputs.exit_code }}"

      - name: Fail after persisting email delivery diagnostics
        if: >-
          steps.send.outcome == 'success' &&
          steps.send.outputs.exit_code != '0'
        run: exit "${{ steps.send.outputs.exit_code }}"
