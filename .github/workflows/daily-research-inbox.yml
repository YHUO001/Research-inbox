name: Daily Research Inbox

on:
  schedule:
    # Singapore time: primary run at 08:17; 20:47 is retry-only.
    - cron: "17 0 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:
    inputs:
      force_openalex:
        description: "Ignore the OpenAlex interval gate during this manual run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  unified-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Decide whether unified discovery should run
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python -m scripts.ingest.scholar_schedule_gate \
            --state-path runtime-state/state/unified_discovery_state.json \
            --event-name "${EVENT_NAME}" \
            --event-schedule "${EVENT_SCHEDULE}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Collect new Scholar alerts
        id: collect
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set +e
          python -m scripts.ingest.gmail_collector \
            --config config/google_scholar_alerts.yaml \
            --state-dir runtime-state/state \
            --output-dir runtime-state/data
          collector_exit_code=$?
          echo "exit_code=${collector_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Discover recent OpenAlex candidates
        id: openalex
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set +e
          FORCE_ARG=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_openalex }}" == "true" ]]; then
            FORCE_ARG="--force"
          fi
          python -m scripts.discovery.openalex_discovery \
            --config config/openalex_discovery.yaml \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --state-path runtime-state/state/openalex_discovery_state.json \
            --manifest-path runtime-state/state/openalex_discovery_manifest.json \
            --schema schemas/openalex_candidate.schema.json \
            --recognition config/recognition_rules.yaml \
            --venues config/venues.yaml \
            ${FORCE_ARG}
          openalex_exit_code=$?
          echo "exit_code=${openalex_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Rebuild unified deterministic routes
        id: route
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set +e
          python -m scripts.pipeline.route_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --recognition-path runtime-state/data/recognition_results.jsonl \
            --queue-dir runtime-state/data/queues \
            --manifest-path runtime-state/state/routing_manifest.json
          route_exit_code=$?
          echo "exit_code=${route_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Refresh normalized metadata
        id: enrich
        if: >-
          steps.schedule_gate.outputs.should_run == 'true' &&
          steps.route.outputs.exit_code == '0'
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RESEARCH_INBOX_CONTACT_EMAIL: ${{ vars.RESEARCH_INBOX_CONTACT_EMAIL }}
        run: |
          set +e
          python -m scripts.enrich.enrich_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --output-path runtime-state/data/enriched_paper_registry.jsonl \
            --manifest-path runtime-state/state/enrichment_manifest.json \
            --cache-path runtime-state/state/enrichment_cache.json \
            --config config/metadata_enrichment.yaml \
            --schema schemas/enriched_paper.schema.json
          enrich_exit_code=$?
          echo "exit_code=${enrich_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build unified scores and budgeted queue
        id: score
        if: >-
          steps.schedule_gate.outputs.should_run == 'true' &&
          steps.route.outputs.exit_code == '0' &&
          steps.enrich.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -m scripts.pipeline.score_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --enriched-path runtime-state/data/enriched_paper_registry.jsonl \
            --recognition-path runtime-state/data/recognition_results.jsonl \
            --history-path runtime-state/state/summary_history.json \
            --scoring-path runtime-state/data/scoring_results.jsonl \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --manifest-path runtime-state/state/selection_manifest.json \
            --config config/scoring.yaml \
            --scoring-schema schemas/scoring_result.schema.json \
            --queue-schema schemas/llm_candidate.schema.json
          score_exit_code=$?
          echo "exit_code=${score_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Mark unified discovery success
        if: >-
          steps.schedule_gate.outputs.should_run == 'true' &&
          steps.collect.outputs.exit_code == '0' &&
          steps.openalex.outputs.exit_code == '0' &&
          steps.route.outputs.exit_code == '0' &&
          steps.enrich.outputs.exit_code == '0' &&
          steps.score.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          state = {
              "schema_version": 1,
              "last_successful_run_at": now.isoformat().replace("+00:00", "Z"),
              "last_successful_local_date": now.astimezone(
                  ZoneInfo("Asia/Singapore")
              ).date().isoformat(),
              "components": {
                  "google_scholar": "success",
                  "openalex": "success_or_interval_skip",
                  "routing": "success",
                  "enrichment": "success",
                  "scoring": "success",
              },
          }
          path = Path("runtime-state/state/unified_discovery_state.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          temporary = path.with_suffix(".tmp")
          temporary.write_text(
              json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          temporary.replace(path)
          PY

      - name: Persist unified discovery state
        if: always()
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          git add state data

          if git diff --cached --quiet; then
            echo "No unified discovery changes to persist."
            exit 0
          fi

          git commit -m "Update unified research discovery state [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state

      - name: Fail after persisting retry diagnostics
        if: always() && steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          SCHOLAR_EXIT: ${{ steps.collect.outputs.exit_code }}
          OPENALEX_EXIT: ${{ steps.openalex.outputs.exit_code }}
          ROUTE_EXIT: ${{ steps.route.outputs.exit_code }}
          ENRICH_EXIT: ${{ steps.enrich.outputs.exit_code }}
          SCORE_EXIT: ${{ steps.score.outputs.exit_code }}
        run: |
          for item in \
            "Scholar:${SCHOLAR_EXIT:-1}" \
            "OpenAlex:${OPENALEX_EXIT:-1}" \
            "Routing:${ROUTE_EXIT:-1}" \
            "Enrichment:${ENRICH_EXIT:-1}" \
            "Scoring:${SCORE_EXIT:-1}"; do
            name="${item%%:*}"
            code="${item##*:}"
            if [[ "${code}" != "0" ]]; then
              echo "${name} failed with exit code ${code}."
              exit "${code}"
            fi
          done
