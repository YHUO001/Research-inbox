name: Benchmark DeepSeek Flash vs Pro

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  benchmark-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Refresh identical provider-neutral summary requests
        run: |
          python -m scripts.summarize.prepare_digest \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --selection-manifest-path runtime-state/state/selection_manifest.json \
            --config config/summary_generation.yaml \
            --request-schema schemas/summary_request.schema.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json

      - name: Benchmark Flash and Pro with candidate-level isolation
        id: benchmark
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          python -m scripts.summarize.benchmark_deepseek_models_v2 \
            --dry-run-manifest-path runtime-state/state/summary_generation_manifest.json \
            --summary-schema schemas/paper_summary.schema.json \
            --config config/summary_generation.yaml \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/deepseek_benchmark_manifest.json
          benchmark_exit_code=$?
          if [ -f runtime-state/state/deepseek_benchmark_manifest.json ]; then
            cat runtime-state/state/deepseek_benchmark_manifest.json
          fi
          echo "exit_code=${benchmark_exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Persist isolated benchmark artifacts
        if: always()
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"

          # prepare_digest is used only to refresh identical requests. Restore its
          # normal dry-run outputs so they cannot block rebase or enter this commit.
          git restore -- \
            data/summary_requests \
            data/digests \
            state/summary_generation_manifest.json || true
          git clean -fd -- data/summary_requests data/digests

          git add \
            data/benchmarks/deepseek \
            state/deepseek_benchmark_manifest.json
          if git diff --cached --quiet; then
            echo "No DeepSeek benchmark changes to persist."
            exit 0
          fi
          git commit -m "Benchmark DeepSeek Flash and Pro summaries [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state

      - name: Fail after persisting catastrophic benchmark diagnostics
        if: steps.benchmark.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.benchmark.outputs.exit_code }}"
