name: Prepare Human Summary Review

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Canonicalize summaries and build review packet
        run: |
          python -m scripts.summarize.build_review_packet_compatible \
            --generation-manifest-path runtime-state/state/summary_generation_manifest.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --review-manifest-path runtime-state/state/summary_review_manifest.json
          python -m scripts.summarize.add_doi_links \
            --generation-manifest-path runtime-state/state/summary_generation_manifest.json \
            --output-root runtime-state/data
          cat runtime-state/state/summary_review_manifest.json

      - name: Persist review artifacts
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          mkdir -p data/reviews
          git add -A -- \
            data/summaries \
            data/digests \
            data/reviews \
            state/summary_generation_manifest.json \
            state/summary_review_manifest.json
          if git diff --cached --quiet; then
            echo "No human review changes to persist."
            exit 0
          fi
          git commit -m "Prepare human summary review packet [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state
