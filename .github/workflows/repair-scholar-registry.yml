name: Repair Scholar Registry

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  reparse-processed-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Reparse processed Scholar alerts
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          python -m scripts.maintenance.reparse_scholar \
            --config config/google_scholar_alerts.yaml \
            --state-path runtime-state/state/gmail_ingestion_state.json \
            --registry-path runtime-state/data/paper_registry.jsonl

      - name: Persist repaired registry
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          git add state data
          if git diff --cached --quiet; then
            echo "No registry changes to persist."
            exit 0
          fi
          git commit -m "Repair Scholar registry with parser v2 [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state
