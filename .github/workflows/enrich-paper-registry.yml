name: Enrich Paper Registry

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  enrich-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Enrich immutable paper registry
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RESEARCH_INBOX_CONTACT_EMAIL: ${{ vars.RESEARCH_INBOX_CONTACT_EMAIL }}
        run: |
          python -m scripts.enrich.enrich_registry \
            --registry-path runtime-state/data/paper_registry.jsonl \
            --output-path runtime-state/data/enriched_paper_registry.jsonl \
            --manifest-path runtime-state/state/enrichment_manifest.json \
            --cache-path runtime-state/state/enrichment_cache.json \
            --config config/metadata_enrichment.yaml \
            --schema schemas/enriched_paper.schema.json

      - name: Persist normalized enrichment state
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          git add data/enriched_paper_registry.jsonl state/enrichment_manifest.json state/enrichment_cache.json
          if git diff --cached --quiet; then
            echo "No enrichment changes to persist."
            exit 0
          fi
          git commit -m "Enrich paper registry metadata [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state
