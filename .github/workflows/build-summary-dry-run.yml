name: Build Summary Dry Run

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-research-inbox-state-writer
  cancel-in-progress: false

jobs:
  prepare-summary-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pipeline code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Check out automation state
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: automation-state
          path: runtime-state
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Prepare provider-neutral summary requests and digest preview
        run: |
          python -m scripts.summarize.prepare_digest \
            --queue-path runtime-state/data/queues/llm_candidate_queue.jsonl \
            --selection-manifest-path runtime-state/state/selection_manifest.json \
            --config config/summary_generation.yaml \
            --request-schema schemas/summary_request.schema.json \
            --summary-schema schemas/paper_summary.schema.json \
            --output-root runtime-state/data \
            --manifest-path runtime-state/state/summary_generation_manifest.json

      - name: Persist summary dry-run artifacts
        shell: bash
        run: |
          cd runtime-state
          git config user.name "research-inbox-bot"
          git config user.email "research-inbox-bot@users.noreply.github.com"
          git add \
            data/summary_requests \
            data/digests \
            state/summary_generation_manifest.json
          if git diff --cached --quiet; then
            echo "No summary dry-run changes to persist."
            exit 0
          fi
          git commit -m "Prepare summary requests and digest preview [skip ci]"
          git pull --rebase origin automation-state
          git push origin HEAD:automation-state
